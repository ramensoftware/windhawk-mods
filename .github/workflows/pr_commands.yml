name: PR flow commands

on:
  issue_comment:
    types:
      - created
      - edited

# Everything is done with the windhawk-reviewer app token, so the workflow token
# only needs to check out the default branch.
permissions:
  contents: read

jobs:
  run:
    # A cheap prefilter, so that an ordinary comment doesn't start a runner. The
    # comment is parsed properly in pr_flow.cjs. Unlike the workflow token, an
    # app token triggers workflows, so the app's own comments, which quote the
    # commands, are filtered out here too. Forks don't have the app's private key.
    if: >-
      github.repository == 'ramensoftware/windhawk-mods' &&
      github.event.issue.pull_request &&
      github.event.comment.user.type != 'Bot' &&
      (contains(github.event.comment.body, '/ai-review') ||
       contains(github.event.comment.body, '/ready-for-reviewer'))
    # The group is shared with pr_labels.yml, so that a command and a pull request
    # event don't act on the same labels at once. It's set on the job so that a
    # comment filtered out above doesn't join the group and cancel a pending run.
    concurrency:
      group: pr-flow-labels-${{ github.event.issue.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Only the flow script is needed, so the mod sources are skipped.
          sparse-checkout: .github

      - name: Generate an app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          # The windhawk-reviewer app.
          app-id: '4425681'
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Run the command
        uses: actions/github-script@v9
        env:
          BOT_LOGIN: ${{ steps.app-token.outputs.app-slug }}[bot]
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          # A transient 5xx would otherwise fail the run halfway through a label
          # change. 4xx codes stay exempt, so removeLabels still sees its 404.
          retries: 3
          script: |
            const flow = require('${{ github.workspace }}/.github/pr_flow.cjs');
            await flow.handleComment({
              github,
              context,
              core,
              botLogin: process.env.BOT_LOGIN,
            });
