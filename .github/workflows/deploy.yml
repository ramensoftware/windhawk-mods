name: Deploy static content

defaults:
  run:
    shell: bash

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '2 0 * * *'

concurrency:
  group: deploy-static-content
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'

# The deployment is built in one job and pushed in another, since a job's token
# is exposed to all of its steps, whichever ones it's passed to. The build runs
# tools and packages, so only the push job's token can write.
jobs:
  # Builds the deployment as a commit on top of the pages branch, and hands it
  # over as a git bundle. The token reads the pull requests and their comments
  # for the external catalog.
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Clone last deployed content
        run: |
          # The deployed content has image paths that are derived from URLs,
          # which are case-sensitive, but CI runs on Windows, which is
          # case-insensitive by default. Enable case-sensitive paths for the
          # target folder before checking out into it, as subdirectories inherit
          # the setting.
          mkdir -p "${{ runner.temp }}/last_deploy"
          fsutil.exe file setCaseSensitiveInfo "${{ runner.temp }}/last_deploy" enable
          # Also tell git itself to treat paths case-sensitively, so it doesn't
          # collapse image paths that differ only by case during checkout or,
          # later, when staging the updated content for deployment. The setting
          # persists in the clone's config and is reused by the commit step.
          git clone -c core.ignorecase=false --branch pages --depth 1 https://github.com/${{ github.repository }}.git "${{ runner.temp }}/last_deploy"
      - name: Cache Windhawk
        id: cache-windhawk
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/windhawk
          key: v1-${{ runner.os }}-1.7.3
      - name: Extract Windhawk
        if: steps.cache-windhawk.outputs.cache-hit != 'true'
        run: |
          installer_url="https://github.com/ramensoftware/windhawk/releases/download/v1.7.3/windhawk_setup.exe"
          installer_path="${{ runner.temp }}/windhawk_setup.exe"
          echo "Downloading $installer_url to $installer_path"
          curl -L "$installer_url" -o "$installer_path"
          (cd "${{ runner.temp }}" && echo "5116cc1703384aac88b8d7a3b57f172aea5da32b6df7355fb2f8247d23813c8f windhawk_setup.exe" | sha256sum -c)

          extract_path="${{ runner.temp }}\windhawk"
          echo "Extracting $installer_path to $extract_path"
          MSYS_NO_PATHCONV=1 "$installer_path" /S /PORTABLE "/D=$extract_path"
      - name: Cache image tools
        id: cache-image-tools
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/image_tools
          key: v1-${{ runner.os }}-gifsicle-1.95-libwebp-1.5.0
      - name: Download image tools
        if: steps.cache-image-tools.outputs.cache-hit != 'true'
        run: |
          cd "${{ runner.temp }}"
          curl -fsSL https://eternallybored.org/misc/gifsicle/releases/gifsicle-1.95-win64.zip -o gifsicle.zip
          curl -fsSL https://storage.googleapis.com/downloads.webmproject.org/releases/webp/libwebp-1.5.0-windows-x64.zip -o libwebp.zip
          sha256sum -c <<'EOF'
          7e47dd0bfd5ee47f911464c57faeed89a8709a7625dd1c449b16579889539ee8  gifsicle.zip
          e8fe3bc7eb09774e69261a42bf9fa8a37ab5f3eecaab199f6420e6f9e822090c  libwebp.zip
          EOF
          python -m zipfile -e gifsicle.zip gifsicle
          python -m zipfile -e libwebp.zip libwebp
          mkdir -p image_tools
          mv gifsicle/gifsicle.exe libwebp/libwebp-1.5.0-windows-x64/bin/gif2webp.exe image_tools
      - name: Install dependencies
        # The dev dependencies are type declarations, used by editors and by
        # type checking. Nothing here consumes them, as tsx strips types without
        # checking them. No install scripts run: esbuild, the only package with
        # one, finds its binary without it.
        run: npm ci --omit=dev --ignore-scripts
      - name: Prepare static content
        run: npx tsx deploy.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WINDHAWK_MODS_LAST_DEPLOY_PATH: ${{ runner.temp }}\last_deploy
          WINDHAWK_PATH: ${{ runner.temp }}\windhawk
      - name: Archive mod images
        run: |
          # Image paths are derived from URLs, which are case-sensitive, but CI
          # runs on Windows, which is case-insensitive by default. Enable
          # case-sensitive paths for the images folder before creating anything
          # inside it, as subdirectories inherit the setting.
          mkdir -p images
          fsutil.exe file setCaseSensitiveInfo images enable
          # Copy last deployed images.
          cp -R "${{ runner.temp }}/last_deploy/images/." images
          # Archive new images, compressing GIFs with the image tools.
          export PATH="$(cygpath -u '${{ runner.temp }}/image_tools'):$PATH"
          python scripts/archive_mod_images.py
      - name: Commit the deployment
        id: commit
        run: |
          src_dir=.
          deploy_dir="${{ runner.temp }}/last_deploy"

          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          echo Adding generated files to the repository
          git --git-dir="$deploy_dir/.git" --work-tree="$src_dir" add -A
          touch "$deploy_dir/.nojekyll"
          git -C "$deploy_dir" add .nojekyll
          if git -C "$deploy_dir" diff-index --cached --quiet HEAD; then
            echo Nothing to deploy
            echo changed=false >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo Committing changes
          git --git-dir="$deploy_dir/.git" --work-tree="$src_dir" commit -m "deploy: ${{ github.sha }}"
          # The bundle holds only what the new commit adds to the deployed one.
          git -C "$deploy_dir" bundle create "${{ runner.temp }}/deploy.bundle" origin/pages..pages
          echo changed=true >> "$GITHUB_OUTPUT"
      - name: Upload the deployment
        if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: deployment
          path: ${{ runner.temp }}/deploy.bundle
          if-no-files-found: error
          retention-days: 1
          # A bundle is compressed already.
          compression-level: 0

  # Pushes the deployment to the pages branch. Its token can push, so it runs
  # nothing but git and GitHub's own actions.
  push:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the deployment
        uses: actions/download-artifact@v8
        with:
          name: deployment
          path: ${{ runner.temp }}/deployment
      - name: Push
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Blobless, as the bundle holds the new files. Git fetches only the
          # deployed files that the bundle stores changes to.
          git clone --bare --filter=blob:none --branch pages --depth 1 https://github.com/${{ github.repository }}.git "${{ runner.temp }}/pages.git"
          cd "${{ runner.temp }}/pages.git"
          git fetch "${{ runner.temp }}/deployment/deploy.bundle" pages

          echo Pushing to GitHub
          git push "https://x-access-token:$GITHUB_TOKEN@github.com/${{ github.repository }}.git" FETCH_HEAD:refs/heads/pages
