name: Import taskbar hardware telemetry mod

on:
  push:
    branches:
      - add-taskbar-hardware-telemetry-clock-customisation
    paths:
      - .github/workflows/import-taskbar-hardware-telemetry.yml

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Fetch mod source
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/connorstx/taskbar-hardware-telemetry-clock-customisation/main/taskbar-hardware-telemetry-clock-customisation.wh.cpp \
            --output mods/taskbar-hardware-telemetry-clock-customisation.wh.cpp

      - name: Commit mod source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mods/taskbar-hardware-telemetry-clock-customisation.wh.cpp
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add Taskbar Hardware Telemetry and Clock Customisation"
          git push
