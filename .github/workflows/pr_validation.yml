name: PR mod validation

on:
  pull_request:
    branches:
      - main

env:
  PYTHONUTF8: '1'

# The pull request labels are read on top of the checked out code.
permissions:
  contents: read
  pull-requests: read

jobs:
  run:
    runs-on: ubuntu-latest
    name: Test changed files
    steps:
      # The test merge commit and its parents, which are diffed to list the
      # changed files.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: python -m pip install pyyaml

      # The event payload carries the labels from the moment the event fired,
      # so a re-run would still see the old ones. Reading them here is what
      # lets a re-run of a failed run pick up a label that was just added.
      - name: Get the pull request labels
        id: pr-labels
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo 'labels<<LABELS_EOF'
            gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --json labels --jq '[.labels[].name]'
            echo 'LABELS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Validate the changes
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_AUTHOR_ID: ${{ github.event.pull_request.user.id }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ steps.pr-labels.outputs.labels }}
        run: |
          python .github/pr_validation.py
