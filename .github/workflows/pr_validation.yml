name: PR mod validation

on:
  pull_request:
    branches:
      - main

env:
  PYTHONUTF8: '1'

# The pull request labels are read on top of the checked out code.
permissions:
  contents: read
  pull-requests: read

jobs:
  # Fails on errors, which block the merge.
  run:
    runs-on: ubuntu-latest
    name: Test changed files
    outputs:
      review-item-count: ${{ steps.validate.outputs.review_item_count }}
    steps:
      # The test merge commit and its parents, which are diffed to list the
      # changed files.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: python -m pip install pyyaml

      # The event payload carries the labels from the moment the event fired,
      # so a re-run would still see the old ones. Reading them here is what
      # lets a re-run of a failed run pick up a label that was just added.
      - name: Get the pull request labels
        id: pr-labels
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo 'labels<<LABELS_EOF'
            gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --json labels --jq '[.labels[].name]'
            echo 'LABELS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Validate the changes
        id: validate
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_AUTHOR_ID: ${{ github.event.pull_request.user.id }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ steps.pr-labels.outputs.labels }}
        run: |
          python .github/pr_validation.py

  # Fails on review items, which are left to the reviewer and don't block the
  # merge by themselves.
  review-items:
    needs: run
    # The review items are reported even when there are errors. A validation that
    # didn't complete has no count, and nothing to report.
    if: ${{ !cancelled() && needs.run.outputs.review-item-count != '' }}
    runs-on: ubuntu-latest
    name: Manual review
    steps:
      - name: Check for review items
        env:
          REVIEW_ITEM_COUNT: ${{ needs.run.outputs.review-item-count }}
        run: |
          if [ "$REVIEW_ITEM_COUNT" -gt 0 ]; then
            echo "::error::Got $REVIEW_ITEM_COUNT review items, which require manual inspection by a reviewer. See the warnings of the \"Test changed files\" job."
            exit 1
          fi
